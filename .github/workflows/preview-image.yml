name: preview-image

# Publishes ghcr.io/egoushka/recipes:sha-<head sha> for each pull request of this repo, so nickel's preview controller can run
# the PR (homelab docs/specs/2026-11-25-environments.md: `x-homelab.env.preview` of stacks/recipes). Same-repo branches only:
# a fork's pull request has no packages: write and never gets a preview. The image is built from the PR head, not the merge ref.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [Dockerfile, Directory.Build.props, recipes.slnx, src/**, .github/workflows/preview-image.yml]

permissions:
  contents: read

concurrency:
  group: preview-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/egoushka/recipes:sha-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=preview
          cache-to: type=gha,scope=preview,mode=max
